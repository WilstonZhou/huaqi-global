name: 百度主动推送

# 百度「普通收录」主动推送 —— 大陆市场收录速度最快的通道。
# 触发时机与 IndexNow 一致:新增/调整页面必然改动 sitemap.xml。
# 手动触发可选 all(推 sitemap 全量) / changed(只推 lastmod 为今天的)。
#
# 首次启用前需在仓库 Settings → Secrets 添加:
#   BAIDU_PUSH_TOKEN —— 从 https://ziyuan.baidu.com/ 站点管理 → 普通收录 → 推送接口 获取
# 未配置 secret 时任务会静默跳过(不判失败),避免 fork/新克隆误报红。
on:
  push:
    branches: [master]
    paths: ['sitemap.xml']
  workflow_dispatch:
    inputs:
      mode:
        description: 'diff = 只推与上一版 sitemap 的差异(默认); all = 推 sitemap 全量'
        type: choice
        options: [diff, all]
        default: diff

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2          # 需要上一版 sitemap 做差异对比
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 检查 token
        id: guard
        run: |
          if [ -z "${{ secrets.BAIDU_PUSH_TOKEN }}" ]; then
            echo "::notice::未配置 BAIDU_PUSH_TOKEN,跳过百度主动推送"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 推送 URL 给百度
        if: steps.guard.outputs.skip == 'false'
        env:
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "all" ]; then
            echo "— 手动全量推送 sitemap"
            node scripts/baidu-push.js
            exit 0
          fi

          extract() { grep -o '<loc>[^<]*</loc>' "$1" | sed 's|</\?loc>||g' | sort -u; }
          if git rev-parse HEAD^ >/dev/null 2>&1 && git cat-file -e HEAD^:sitemap.xml 2>/dev/null; then
            extract <(git show HEAD^:sitemap.xml) > /tmp/old.txt
          else
            : > /tmp/old.txt
          fi
          extract sitemap.xml > /tmp/new.txt
          comm -13 /tmp/old.txt /tmp/new.txt > /tmp/added.txt || true

          if [ -s /tmp/added.txt ]; then
            echo "— 本次新增/更新 $(grep -c . /tmp/added.txt) 条 URL"
            node scripts/baidu-push.js --file /tmp/added.txt
          else
            echo "— 无新增 URL,跳过"
          fi
